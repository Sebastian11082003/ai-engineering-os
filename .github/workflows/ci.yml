name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  living-docs:
    name: Documentación viva
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verificar que el cambio actualiza la documentación
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-living-docs.js

  validate:
    name: Estructura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository structure
        run: |
          test -f FRAMEWORK_RULES.md
          test -f MASTER.md
          test -f .living-docs.json
          test -f scripts/check-living-docs.js
          test -f standards/documentation-structure.md
          test -f playbooks/documentation-stage-playbook.md
          test -f templates/ci/living-docs.json
          if grep -q 'docs/10-devops' .living-docs.json; then
            echo "El mapa del OS no debe exigir docs/10-devops (eso es de proyectos consumidores)."
            exit 1
          fi
